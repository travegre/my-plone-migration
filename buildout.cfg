[buildout]
extends =
    https://dist.plone.org/release/5.2.14/versions.cfg
    buildout-base.cfg

effective-user = plone
buildout-user = plone

parts =
    instance
    zeoserver

develop =
    src/imiimenik.podoba
    src/imiimenik.produkti
    src/dezurstva.podoba
    src/dezurstva.produkti
    src/kiestra.podoba
    src/kiestra.produkti
    src/preiskave.podoba
    src/preiskave.produkti

[instance]
recipe = plone.recipe.zope2instance
http-address = 8080
user = ${buildout:user}
effective-user = ${buildout:effective-user}
zeo-client = true
zeo-address = zeoserver:8100
blob-storage = ${buildout:var-dir}/blobstorage
shared-blob = on
eggs =
    ${buildout:eggs}
    imiimenik.podoba
    imiimenik.produkti
    dezurstva.podoba
    dezurstva.produkti
    kiestra.podoba
    kiestra.produkti
    preiskave.podoba
    preiskave.produkti

[zeoserver]
recipe = plone.recipe.zeoserver
zeo-address = 0.0.0.0:8100