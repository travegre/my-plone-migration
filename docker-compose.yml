version: "3.8"

services:
  zeoserver:
    build: .
    command: bin/zeoserver fg
    volumes:
      - ./var/filestorage:/plone/instance/var/filestorage
      - ./var/blobstorage:/plone/instance/var/blobstorage
    networks:
      - plone
    healthcheck:
      test: ["CMD-SHELL", "ss -tln | grep -q ':8100'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  instance:
    build: .
    command: bin/instance console
    ports:
      - "8090:8080"
    volumes:
      - ./src:/plone/instance/src
    depends_on:
      zeoserver:
        condition: service_healthy
    networks:
      - plone
    restart: on-failure

networks:
  plone:
