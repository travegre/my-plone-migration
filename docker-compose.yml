version: "3.8"

services:
  zeoserver:
    build: .
    command: bin/zeoserver fg
    volumes:
      - ./var/filestorage:/plone/instance/var/filestorage
      - ./var/blobstorage:/plone/instance/var/blobstorage
    networks:
      - plone
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.connect(('localhost', 8100)); s.close()\""]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  instance:
    build: .
    command: bin/instance console
    ports:
      - "8080:8080"
    volumes:
      - ./src:/plone/instance/src
    depends_on:
      zeoserver:
        condition: service_healthy
    networks:
      - plone
    restart: on-failure

networks:
  plone: